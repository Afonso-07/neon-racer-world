
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RACER WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050811;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#menu{position:absolute;inset:0;background:linear-gradient(120deg,#06101deF,#080817ed);z-index:5;overflow:auto;padding:22px}
h1{font-size:clamp(30px,6vw,65px);margin:8px 0;color:#00eaff;letter-spacing:3px;text-shadow:0 0 25px #00cfff}
h2{color:#00eaff}
.panel{max-width:1050px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.item{background:#111d2c;border:1px solid #28445d;border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.item.selected{border:2px solid #00eaff;box-shadow:0 0 16px #00aaff66}
.item img{width:100%;height:85px;object-fit:contain}
button,select{background:#10283b;color:white;border:1px solid #00bce8;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}
button:hover{background:#07506b}
#start{background:#00c9ed;color:#00111b;font-size:19px;padding:16px 35px;margin:20px 0}
#hud{display:none;position:absolute;inset:0;pointer-events:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hudbox{background:#071522dd;padding:10px 14px;border:1px solid #00bce8;border-radius:9px}
#speed{font-size:30px;color:#00eaff;font-weight:bold}
#controls{position:absolute;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.pad{display:flex;gap:10px}
.control{pointer-events:auto;width:65px;height:65px;border-radius:50%;font-size:25px;background:#092b43cc;border:2px solid #00d9ff;touch-action:none}
#gas{height:78px;width:78px;background:#006b50cc}
#brake{height:68px;width:68px;background:#77252acc}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;text-align:center}
#garageBtn{pointer-events:auto}
#loading{position:absolute;bottom:10px;left:10px;color:#a8cddd;font-size:12px}
@media(max-width:600px){#menu{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.item img{height:65px}.hudbox{padding:7px;font-size:12px}}
</style>
</head>
<body>

<div id="menu">
<div class="panel">
<h1>NEON RACER WORLD</h1>
<p>Escolhe o teu carro e prepara-te para correr.</p>

<h2>GARAGEM — 12 CARROS</h2>
<div class="grid" id="cars"></div>

<h2>PERSONALIZAR</h2>
<label>Cor do carro: </label>
<input type="color" id="paint" value="#00cfff">

<h2>ESCOLHE A PISTA</h2>
<select id="track" style="width:100%;max-width:400px"></select>

<h2>AMBIENTE</h2>
<select id="weather">
<option value="day">Dia</option>
<option value="night">Noite</option>
<option value="rain">Chuva</option>
</select>

<br>
<button id="start">ENTRAR NA CORRIDA</button>
<p>Dinheiro: <strong id="money">€ 0</strong></p>
<p>Recorde: <strong id="record">0 km/h</strong></p>
<p style="color:#91aabd;font-size:12px">Os modelos 3D externos podem ser adicionados na pasta assets/models.</p>
</div>
</div>

<div id="hud">
<div id="top">
<div class="hudbox"><div>VELOCIDADE</div><span id="speed">0</span> km/h</div>
<div class="hudbox">PISTA: <span id="trackName"></span></div>
<div class="hudbox">NITRO: <span id="nitro">100%</span></div>
<button id="cameraBtn">CÂMARA</button>
<button id="garageBtn">GARAGEM</button>
</div>
<div id="controls">
<div class="pad">
<button class="control" data-key="left">◀</button>
<button class="control" data-key="right">▶</button>
</div>
<div class="pad">
<button class="control" id="brake" data-key="brake">▼</button>
<button class="control" id="gas" data-key="gas">▲</button>
<button class="control" data-key="nitro">N</button>
<button class="control" data-key="drift">D</button>
</div>
</div>
<div id="loading"></div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

const cars=[
{name:'BMW M4',model:'bmw-m4',price:0},
{name:'Porsche 911 GT3 RS',model:'porsche-911',price:15000},
{name:'Nissan GT-R',model:'nissan-gtr',price:20000},
{name:'Lamborghini Huracán',model:'lamborghini',price:35000},
{name:'Ferrari 488',model:'ferrari',price:40000},
{name:'McLaren 720S',model:'mclaren',price:45000},
{name:'Audi R8',model:'audi-r8',price:25000},
{name:'Mercedes AMG GT',model:'mercedes-amg',price:22000},
{name:'Ford Mustang',model:'mustang',price:12000},
{name:'Chevrolet Corvette',model:'corvette',price:28000},
{name:'Bugatti Chiron',model:'bugatti',price:90000},
{name:'Koenigsegg Jesko',model:'koenigsegg',price:100000}
];

// Coloca os ficheiros GLB nesta pasta e associa os nomes abaixo.
// Exemplo: assets/models/bmw-m4.glb
const MODEL_URLS={
// 'bmw-m4':'assets/models/bmw-m4.glb',
// 'porsche-911':'assets/models/porsche-911.glb',
};

const tracks=[
{name:'Neon City',sky:0x101b39,ground:0x17252b,road:0x252b35,points:[[-100,0],[0,0],[110,20],[160,100],[80,170],[-60,150],[-150,80],[-100,0]]},
{name:'Grand Prix Circuit',sky:0x7799b5,ground:0x285331,road:0x292d34,points:[[-160,-100],[40,-130],[170,-70],[150,70],[70,130],[-100,120],[-180,40],[-160,-100]]},
{name:'Mountain Drift',sky:0x9ab7ca,ground:0x334a36,road:0x35383c,points:[[-130,-140],[-20,-90],[100,-120],[150,-20],[70,80],[-60,130],[-140,50],[-130,-140]]},
{name:'Ocean Drive',sky:0x68b7d5,ground:0x2d8062,road:0x343b42,points:[[-150,-130],[-40,-150],[100,-110],[160,-20],[100,80],[-20,130],[-140,70],[-150,-130]]},
{name:'Desert Storm',sky:0xe2a66e,ground:0x9b7140,road:0x353536,points:[[-160,-100],[-50,-150],[90,-120],[150,-20],[100,100],[-30,140],[-150,40],[-160,-100]]},
{name:'Forest Racing',sky:0x8ba9a1,ground:0x173d2a,road:0x34383b,points:[[-140,-130],[-20,-160],[130,-90],[150,40],[60,140],[-90,110],[-160,0],[-140,-130]]}
];

let selected=0,selectedTrack=0;
let money=Number(localStorage.getItem('nrw_money')||0);
let record=Number(localStorage.getItem('nrw_record')||0);
let unlocked=JSON.parse(localStorage.getItem('nrw_unlocked')||'[0]');
let paint='#00cfff';

$('money').textContent='€ '+money.toLocaleString('pt-PT');
$('record').textContent=record+' km/h';
$('paint').addEventListener('input',e=>paint=e.target.value);

cars.forEach((c,i)=>{
 const el=document.createElement('div');
 el.className='item'+(i===0?' selected':'');
 el.innerHTML=`<div style="font-size:34px">🏎️</div><b>${c.name}</b><p>${c.price===0?'GRÁTIS':'€ '+c.price.toLocaleString('pt-PT')}</p><small>${unlocked.includes(i)?'DESBLOQUEADO':'BLOQUEADO'}</small>`;
 el.onclick=()=>{
  if(!unlocked.includes(i)){
   if(money<c.price){alert('Ainda não tens dinheiro suficiente!');return}
   money-=c.price;unlocked.push(i);
   localStorage.setItem('nrw_money',money);
   localStorage.setItem('nrw_unlocked',JSON.stringify(unlocked));
  }
  selected=i;
  document.querySelectorAll('#cars .item').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  $('money').textContent='€ '+money.toLocaleString('pt-PT');
 };
 $('cars').appendChild(el);
});

tracks.forEach((t,i)=>{
 const o=document.createElement('option');
 o.value=i;o.textContent=t.name;$('track').appendChild(o);
});

let scene,camera,renderer,clock,carGroup,carVisual,roadCurve;
let roadWidth=17,velocity=0,heading=0,steering=0,nitroPower=100;
let cameraMode=0,running=false,drifting=false;
let rain=null,buildings=[],wheels=[];
const keys={left:false,right:false,gas:false,brake:false,nitro:false,drift:false};
let playerPos=new THREE.Vector3(0,0,0);

function material(color,roughness=.65,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function box(parent,w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);parent.add(m);return m;
}

function makeCar(){
 const g=new THREE.Group();
 const bodyMat=new THREE.MeshPhysicalMaterial({color:paint,metalness:.72,roughness:.24,clearcoat:1,clearcoatRoughness:.12});
 const glass=material(0x102536,.12,.6);
 const dark=material(0x080b10,.5);
 const rubber=material(0x090b0d,.9);
 const rim=material(0xb7c5d0,.25,.9);
 const light= new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x99ddff,emissiveIntensity:2});
 const red= new THREE.MeshStandardMaterial({color:0xff1515,emissive:0x990000,emissiveIntensity:1.5});

 // Carroçaria baixa, com capô e traseira inclinados.
 const shape=new THREE.Shape();
 shape.moveTo(-1.05,-2.2);
 shape.lineTo(1.05,-2.2);
 shape.lineTo(1.18,-1.2);
 shape.lineTo(1.12,1.65);
 shape.lineTo(.9,2.15);
 shape.lineTo(-.9,2.15);
 shape.lineTo(-1.12,1.65);
 shape.lineTo(-1.18,-1.2);
 shape.close();
 const geo=new THREE.ExtrudeGeometry(shape,{depth:.65,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.12,bevelThickness:.12});
 geo.rotateX(-Math.PI/2);
 geo.translate(0,.48,0);
 const shell=new THREE.Mesh(geo,bodyMat);g.add(shell);

 // Capô com forma afunilada.
 const hood=box(g,1.85,.22,1.15,0,.79,-1.28,bodyMat);
 hood.scale.z=1.15;

 // Habitáculo inclinado, não uma caixa vertical.
 const cabinGeo=new THREE.BufferGeometry();
 const v=[
 -0.82,.85,-.45, 0.82,.85,-.45,
 -0.62,1.55,.35, 0.62,1.55,.35,
 -0.72,1.48,1.0, 0.72,1.48,1.0,
 -0.98,.85,1.1, 0.98,.85,1.1
 ];
 const faces=[
 0,2,3,0,3,1, 2,4,5,2,5,3,
 0,6,4,0,4,2, 1,3,5,1,5,7,
 6,7,5,6,5,4
 ];
 cabinGeo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
 cabinGeo.setIndex(faces);cabinGeo.computeVertexNormals();
 const cabin=new THREE.Mesh(cabinGeo,glass);g.add(cabin);

 // Para-brisas e janelas.
 const windshield=box(g,1.28,.05,.48,0,1.39,.32,glass);
 windshield.rotation.x=-.5;
 const rearGlass=box(g,1.25,.05,.42,0,1.38,1.03,glass);
 rearGlass.rotation.x=.5;

 // Spoiler traseiro.
 box(g,1.8,.12,.35,0,1.03,2.05,dark);
 box(g,.12,.38,.12,-.65,.86,1.94,dark);
 box(g,.12,.38,.12,.65,.86,1.94,dark);

 // Para-choques e difusor.
 box(g,2,.25,.25,0,.45,-2.15,dark);
 box(g,2,.22,.25,0,.45,2.18,dark);

 // Faróis e luzes traseiras.
 box(g,.48,.13,.12,-.67,.75,-2.05,light);
 box(g,.48,.13,.12,.67,.75,-2.05,light);
 box(g,.5,.12,.12,-.68,.75,2.08,red);
 box(g,.5,.12,.12,.68,.75,2.08,red);

 // Grelha frontal.
 box(g,.8,.28,.06,0,.59,-2.23,dark);

 // Rodas individuais, com jantes e pneus.
 wheels=[];
 for(const x of [-1.13,1.13]){
  for(const z of [-1.35,1.35]){
   const wheel=new THREE.Group();
   wheel.position.set(x,.48,z);
   const tire=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.32,32),rubber);
   tire.rotation.z=Math.PI/2;wheel.add(tire);
   const rimMesh=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.34,24),rim);
   rimMesh.rotation.z=Math.PI/2;wheel.add(rimMesh);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.10,.10,.36,16),dark);
   hub.rotation.z=Math.PI/2;wheel.add(hub);
   g.add(wheel);wheels.push(wheel);
  }
 }
 return g;
}

function createRoad(curve){
 const samples=500;
 const positions=[],indices=[];
 for(let i=0;i<=samples;i++){
  const t=i/samples,p=curve.getPointAt(t),tan=curve.getTangentAt(t);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  positions.push(p.x+side.x*roadWidth/2,.04,p.z+side.z*roadWidth/2);
  positions.push(p.x-side.x*roadWidth/2,.04,p.z-side.z*roadWidth/2);
  if(i<samples){
   const a=i*2,b=a+1,c=a+2,d=a+3;
   indices.push(a,b,c,b,d,c);
  }
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 geo.setIndex(indices);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:tracks[selectedTrack].road,roughness:.82,side:THREE.DoubleSide}));
 mesh.receiveShadow=true;scene.add(mesh);
}

function addBarrier(curve){
 const mat=material(0xb7c5ce,.45,.6);
 const red=material(0xff2424);
 for(let i=0;i<360;i++){
  const t=i/360,p=curve.getPointAt(t),tan=curve.getTangentAt(t);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  for(const sign of [-1,1]){
   const pos=p.clone().addScaledVector(side,sign*(roadWidth/2+1.2));
   const rail=box(scene,2.5,.65,.35,pos.x,.85,pos.z,mat);
   rail.rotation.y=Math.atan2(tan.x,tan.z);
   if(i%3===0){
    const post=box(scene,.25,1.15,.35,pos.x,.58,pos.z,red);
    post.rotation.y=rail.rotation.y;
   }
  }
 }
}

function createCity(curve){
 const t=tracks[selectedTrack];
 const cityMat=material(selectedTrack===0?0x283d58:0x68747c,.8);
 const glass= new THREE.MeshStandardMaterial({color:0x42758c,metalness:.5,roughness:.2});
 const windowMat=new THREE.MeshStandardMaterial({color:0x91dfff,emissive:0x173e55,emissiveIntensity:.7});
 const count=230;
 for(let i=0;i<count;i++){
  const u=(i/count+Math.random()*.001)%1;
  const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const sign=i%2===0?1:-1;
  // Afastamento mínimo: edifícios sempre fora das bermas.
  const distance=roadWidth/2+19+Math.random()*32;
  const pos=p.clone().addScaledVector(side,sign*distance);
  const w=8+Math.random()*13;
  const d=9+Math.random()*14;
  const h=10+Math.random()*(selectedTrack===0?65:35);
  const building=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),cityMat);
  base.position.y=h/2;building.add(base);
  // Fachadas envidraçadas em pequenas faixas.
  for(let y=3;y<h-2;y+=3.4){
   const strip=new THREE.Mesh(new THREE.BoxGeometry(w*.88,.65,.08),glass);
   strip.position.set(0,y,d/2+.05);building.add(strip);
   const strip2=strip.clone();strip2.position.z=-d/2-.05;building.add(strip2);
  }
  // Janelas na fachada.
  for(let x=-w/2+1.5;x<w/2-1;x+=2.3){
   for(let y=2.5;y<h-2;y+=3.3){
    const win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.25,.09),windowMat);
    win.position.set(x,y,d/2+.11);building.add(win);
   }
  }
  building.position.set(pos.x,0,pos.z);
  building.rotation.y=Math.atan2(tan.x,tan.z);
  scene.add(building);
  buildings.push(building);
 }
}

function createEnvironment(){
 const t=tracks[selectedTrack];
 scene.background=new THREE.Color(t.sky);
 scene.fog=new THREE.Fog(t.sky,150,650);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),material(t.ground));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);

 roadCurve=new THREE.CatmullRomCurve3(
  t.points.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'catmullrom',.35
 );

 createRoad(roadCurve);
 addBarrier(roadCurve);
 createCity(roadCurve);

 // Passeios laterais e árvores afastadas da pista.
 const treeMat=material(0x174f35);
 const trunkMat=material(0x63452b);
 for(let i=0;i<170;i++){
  const u=i/170,p=roadCurve.getPointAt(u),tan=roadCurve.getTangentAt(u);
  const side=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  for(const sign of [-1,1]){
   const pos=p.clone().addScaledVector(side,roadWidth/2+9+Math.random()*8);
   const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,3,8),trunkMat);
   trunk.position.set(pos.x,1.5,pos.z);scene.add(trunk);
   const crown=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,8),treeMat);
   crown.position.set(pos.x,4.5,pos.z);scene.add(crown);
  }
 }
}

function makeScene(){
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xc9e7ff,0x263322,2));
 const sun=new THREE.DirectionalLight(0xffffff,2.5);
 sun.position.set(-100,150,-80);sun.castShadow=true;scene.add(sun);

 createEnvironment();

 carGroup=new THREE.Group();
 scene.add(carGroup);
 carVisual=makeCar();
 carGroup.add(carVisual);

 const start=roadCurve.getPointAt(.05);
 const tangent=roadCurve.getTangentAt(.05);
 playerPos.set(start.x,.1,start.z);
 heading=Math.atan2(tangent.x,tangent.z);
 carGroup.position.copy(playerPos);
 carGroup.rotation.y=heading;

 const color=$('weather').value;
 if(color==='night'){
  scene.background.set(0x030817);
  scene.fog.color.set(0x030817);
  sun.intensity=.25;
  scene.add(new THREE.AmbientLight(0x466baf,1.2));
 }
 if(color==='rain')makeRain();

 clock=new THREE.Clock();
 animate();
}

function makeRain(){
 const count=1800,positions=new Float32Array(count*3);
 for(let i=0;i<count;i++){
  positions[i*3]=(Math.random()-.5)*150;
  positions[i*3+1]=Math.random()*70;
  positions[i*3+2]=(Math.random()-.5)*150;
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
 rain=new THREE.Points(geo,new THREE.PointsMaterial({color:0xb8dfff,size:.16,transparent:true,opacity:.7}));
 scene.add(rain);
}

function loadCarModel(){
 const url=MODEL_URLS[cars[selected].model];
 if(!url)return;
 const loader=new GLTFLoader();
 $('loading').textContent='A carregar modelo 3D...';
 loader.load(url,gltf=>{
  if(carVisual)carGroup.remove(carVisual);
  carVisual=gltf.scene;
  carVisual.scale.setScalar(1);
  carVisual.position.y=0;
  carGroup.add(carVisual);
  wheels=[];
  $('loading').textContent='Modelo 3D carregado';
 },undefined,()=>{
  $('loading').textContent='Modelo não encontrado. A usar carro de reserva.';
 });
}

function resetScene(){
 if(renderer){renderer.dispose();renderer.domElement.remove()}
 if(scene){
  scene.traverse(o=>{
   if(o.geometry)o.geometry.dispose();
   if(o.material){
    if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());
    else o.material.dispose();
   }
  });
 }
 buildings=[];
}

function startGame(){
 selectedTrack=Number($('track').value);
 $('menu').style.display='none';
 $('hud').style.display='block';
 $('trackName').textContent=tracks[selectedTrack].name;
 resetScene();
 makeScene();
 loadCarModel();
 running=true;
}

$('start').onclick=startGame;
$('garageBtn').onclick=()=>{
 running=false;
 $('menu').style.display='block';
 $('hud').style.display='none';
};

$('cameraBtn').onclick=()=>cameraMode=(cameraMode+1)%3;

function setKey(k,v){keys[k]=v}
window.addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.code==='ArrowLeft'||e.code==='KeyA')setKey('left',true);
 if(e.code==='ArrowRight'||e.code==='KeyD')setKey('right',true);
 if(e.code==='ArrowUp'||e.code==='KeyW')setKey('gas',true);
 if(e.code==='ArrowDown'||e.code==='KeyS')setKey('brake',true);
 if(e.code==='ShiftLeft'||e.code==='ShiftRight')setKey('nitro',true);
 if(e.code==='Space')setKey('drift',true);
});
window.addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')setKey('left',false);
 if(e.code==='ArrowRight'||e.code==='KeyD')setKey('right',false);
 if(e.code==='ArrowUp'||e.code==='KeyW')setKey('gas',false);
 if(e.code==='ArrowDown'||e.code==='KeyS')setKey('brake',false);
 if(e.code==='ShiftLeft'||e.code==='ShiftRight')setKey('nitro',false);
 if(e.code==='Space')setKey('drift',false);
});

document.querySelectorAll('[data-key]').forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});
 btn.addEventListener('pointerup',()=>setKey(k,false));
 btn.addEventListener('pointerleave',()=>setKey(k,false));
 btn.addEventListener('pointercancel',()=>setKey(k,false));
});

function updateCar(dt){
 if(!running)return;

 // Direção exclusivamente manual. Não existe alinhamento automático à pista.
 const steer=(keys.left?-1:0)+(keys.right?1:0);
 const accelerating=keys.gas;
 const braking=keys.brake;
 drifting=keys.drift;

 if(accelerating)velocity+=22*dt;
 if(braking)velocity-=38*dt;

 if(keys.nitro&&nitroPower>0&&velocity>5){
  velocity+=42*dt;
  nitroPower=Math.max(0,nitroPower-25*dt);
 }else{
  nitroPower=Math.min(100,nitroPower+7*dt);
 }

 velocity*=Math.pow(drifting?.985:.994,dt*60);
 velocity=Math.max(0,Math.min(100,velocity));

 // Direção dependente do comando e da velocidade.
 const steerStrength=(.65+Math.min(velocity/45,1.2));
 const grip=drifting?.48:1;
 heading+=steer*steerStrength*grip*dt*(velocity/22);

 const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 playerPos.addScaledVector(forward,velocity*dt);

 carGroup.position.copy(playerPos);
 carGroup.rotation.y=heading;
 carGroup.rotation.z=-steer*.055*(velocity/45);
 carGroup.rotation.x=drifting?-.035:0;

 wheels.forEach((w,i)=>{
  w.rotation.x+=velocity*dt*1.8;
  if(i<2)w.rotation.y=steer*.38;
 });

 // Nitro e travagem não controlam a direção.
 $('speed').textContent=Math.round(velocity*2.4);
 $('nitro').textContent=Math.round(nitroPower)+'%';

 const kmh=Math.round(velocity*2.4);
 if(kmh>record){
  record=kmh;
  localStorage.setItem('nrw_record',record);
 }
 $('record').textContent=record+' km/h';

 // Dinheiro por distância percorrida.
 if(Math.random()<.003&&velocity>10){
  money+=5;
  localStorage.setItem('nrw_money',money);
  $('money').textContent='€ '+money.toLocaleString('pt-PT');
 }
}

function updateCamera(dt){
 if(!carGroup)return;
 const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 let targetPos,targetLook;

 if(cameraMode===0){
  targetPos=playerPos.clone().addScaledVector(forward,-11);
  targetPos.y+=5.2;
  targetLook=playerPos.clone().addScaledVector(forward,8);
  targetLook.y+=1;
 }else if(cameraMode===1){
  targetPos=playerPos.clone().add(new THREE.Vector3(0,2.1,0)).addScaledVector(forward,.5);
  targetLook=playerPos.clone().addScaledVector(forward,30);
  targetLook.y+=1.6;
 }else{
  targetPos=playerPos.clone().add(new THREE.Vector3(0,17,0));
  targetLook=playerPos.clone();
 }
 camera.position.lerp(targetPos,1-Math.pow(.001,dt));
 camera.lookAt(targetLook);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(running){
  updateCar(dt);
  updateCamera(dt);
  if(rain){
   const a=rain.geometry.attributes.position;
   for(let i=0;i<a.count;i++){
    a.array[i*3+1]-=45*dt;
    if(a.array[i*3+1]<0)a.array[i*3+1]=65;
   }
   a.needsUpdate=true;
   rain.position.x=playerPos.x;
   rain.position.z=playerPos.z;
  }
 }
 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
