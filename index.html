
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RACER WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101b;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;z-index:5;background:#07101be8;
border:1px solid #00dfff;border-radius:12px;padding:15px 20px;
box-shadow:0 0 20px #00cfff55}
#hud h1{font-size:19px;color:#00eaff;margin:0 0 9px;letter-spacing:2px}
#speed{font-size:32px;font-weight:bold}
#gear{color:#00eaff;font-size:13px}
#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
background:#07101be8;border:1px solid #00bddd;border-radius:10px;
padding:11px 16px;font-size:12px;text-align:center;white-space:nowrap}
#loading{position:fixed;inset:0;background:#07101b;display:grid;
place-items:center;z-index:10;font-size:22px;color:#00eaff}
</style>
</head>
<body>
<div id="loading">A carregar NEON RACER WORLD...</div>
<div id="hud">
<h1>NEON RACER WORLD</h1>
<div>VELOCIDADE</div>
<div id="speed">0 km/h</div>
<div id="gear">MODO LIVRE · NEON CITY</div>
</div>
<div id="help">↑ / W ACELERAR　 ↓ / S TRAVAR　 ← / A ESQUERDA　 → / D DIREITA</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101b30);
scene.fog=new THREE.FogExp2(0x101b30,0.009);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9fcaff,0x263040,2));
const moon=new THREE.DirectionalLight(0xdceaff,2.5);
moon.position.set(-15,25,10);
moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-35;
moon.shadow.camera.right=35;
moon.shadow.camera.top=35;
moon.shadow.camera.bottom=-35;
scene.add(moon);

const cyan=new THREE.PointLight(0x00cfff,40,40);
cyan.position.set(-5,8,-15);
scene.add(cyan);

function material(color,roughness=.5,metalness=.1){
return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function cube(parent,w,h,d,mat,x,y,z){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

// Chão e estrada
const ground=cube(scene,250,.2,400,material(0x17241f),0,-.2,-130);
const road=cube(scene,16,.12,400,material(0x242832,.9),0,-.08,-130);

for(let side of [-1,1]){
cube(scene,.35,.16,400,material(0x858b91),side*8.15,-.02,-130);
cube(scene,3,.12,400,material(0x555b60),side*9.8,-.08,-130);
}

// Marcas da estrada
const markings=[];
for(let i=0;i<60;i++){
const m=cube(scene,.13,.035,4,material(0xeeeeee),0,.005,15-i*7);
markings.push(m);
}

// Linhas laterais
for(let side of [-1,1]){
cube(scene,.12,.035,400,material(0xeeeeee),side*7,.01,-130);
}

// Edifícios
const buildings=[];
const windowMats=[
new THREE.MeshBasicMaterial({color:0x68cfff}),
new THREE.MeshBasicMaterial({color:0xffbb66}),
new THREE.MeshBasicMaterial({color:0x18304a})
];

for(let i=0;i<38;i++){
for(let side of [-1,1]){
const width=5+Math.random()*7;
const height=9+Math.random()*27;
const depth=6+Math.random()*6;
const x=side*(15+Math.random()*10);
const z=-i*11-10;

const building=new THREE.Group();
building.position.set(x,height/2,z);
scene.add(building);

cube(building,width,height,depth,
material(new THREE.Color().setHSL(.59+Math.random()*.12,.3,.13+Math.random()*.1)),
0,0,0);

for(let y=-height/2+2;y<height/2-1;y+=3){
for(let xx=-width/2+1;xx<width/2-1;xx+=2.1){
if(Math.random()>.22){
const win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.5,.06),
windowMats[Math.floor(Math.random()*windowMats.length)]);
win.position.set(xx,y,depth/2+.035);
building.add(win);
}
}
}
buildings.push(building);
}
}

// Candeeiros
const lamps=[];
for(let i=0;i<24;i++){
for(let side of [-1,1]){
const lamp=new THREE.Group();
lamp.position.set(side*8.8,0,-i*16);
scene.add(lamp);
cube(lamp,.13,5,.13,material(0x343d4a),0,2.5,0);
cube(lamp,1.1,.12,.13,material(0x343d4a),-side*.5,5,0);
const bulb=new THREE.Mesh(new THREE.BoxGeometry(.6,.13,.2),
new THREE.MeshBasicMaterial({color:0x8cecff}));
bulb.position.set(-side*.8,4.9,0);
lamp.add(bulb);
lamps.push(lamp);
}
}

// Carro desportivo
const car=new THREE.Group();
scene.add(car);

const paint= new THREE.MeshStandardMaterial({
color:0x087fff,metalness:.85,roughness:.2
});
const black=material(0x080b12,.35,.3);
const glass=new THREE.MeshPhysicalMaterial({
color:0x152b42,metalness:.4,roughness:.12,
transparent:true,opacity:.92
});
const rubber=material(0x080808,.95);
const chrome=material(0xaebbc7,.22,.9);

// Chassis
cube(car,2.15,.48,4.5,paint,0,.7,0);
cube(car,2,.22,3.8,paint,0,.98,-.05);

// Capô
cube(car,1.9,.22,1.4,paint,0,1,-1.35);

// Habitáculo
const cabin=cube(car,1.55,.85,2.05,glass,0,1.48,.2);
cabin.scale.set(1,1,1);

// Tejadilho
cube(car,1.48,.12,1.15,paint,0,1.91,.25);

// Spoiler
cube(car,1.9,.12,.25,black,0,1.35,2.05);
for(let x of [-.7,.7])cube(car,.1,.35,.1,chrome,x,1.18,2.05);

// Rodas
const wheels=[];
for(const x of [-1.12,1.12]){
for(const z of [-1.45,1.45]){
const wheel=new THREE.Group();
wheel.position.set(x,.48,z);
car.add(wheel);
const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.3,32),rubber);
tyre.rotation.z=Math.PI/2;
wheel.add(tyre);
const rim=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.315,24),
material(0x9aa5b0,.25,.9));
rim.rotation.z=Math.PI/2;
wheel.add(rim);
wheels.push(wheel);
}
}

// Faróis
for(const x of [-.7,.7]){
const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.08),
new THREE.MeshBasicMaterial({color:0xb9f4ff}));
head.position.set(x,.91,-2.27);
car.add(head);
const lamp=new THREE.SpotLight(0xc5f3ff,70,45,.45,.5,1.5);
lamp.position.set(x,.9,-2.1);
lamp.target.position.set(x,0,-20);
car.add(lamp);
car.add(lamp.target);
const rear=new THREE.Mesh(new THREE.BoxGeometry(.55,.15,.08),
new THREE.MeshBasicMaterial({color:0xff1010}));
rear.position.set(x,.88,2.27);
car.add(rear);
}

car.position.set(0,0,2);

// Controlos: esquerda é negativa, direita é positiva
const keys={};
addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

let speed=0;
let steering=0;
const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);

const accelerating=keys.w||keys.arrowup;
const braking=keys.s||keys.arrowdown;
if(accelerating)speed+=38*dt;
else speed-=9*dt;
if(braking)speed-=65*dt;
speed=THREE.MathUtils.clamp(speed,0,240);

// Direção correta
const left=keys.a||keys.arrowleft;
const right=keys.d||keys.arrowright;
const direction=(right?1:0)-(left?1:0);

steering=THREE.MathUtils.lerp(steering,direction,Math.min(1,dt*5));
car.position.x+=steering*(speed/240)*11*dt;
car.position.x=THREE.MathUtils.clamp(car.position.x,-5.7,5.7);

car.rotation.z=-steering*.10*(speed/100);
car.rotation.y=-steering*.09;

wheels.forEach(w=>w.rotation.x+=speed*dt/30);

// Movimento do mundo
const movement=speed*dt*.38;
markings.forEach(m=>{
m.position.z+=movement;
if(m.position.z>18)m.position.z-=420;
});
buildings.forEach(b=>{
b.position.z+=movement;
if(b.position.z>25)b.position.z-=418;
});
lamps.forEach(l=>{
l.position.z+=movement;
if(l.position.z>20)l.position.z-=384;
});

// Câmara suave
const targetX=car.position.x*.55;
camera.position.x=THREE.MathUtils.lerp(camera.position.x,targetX,dt*3);
camera.position.y=THREE.MathUtils.lerp(camera.position.y,4.8,dt*2);
camera.position.z=THREE.MathUtils.lerp(camera.position.z,10,dt*2);
camera.lookAt(car.position.x*.4,1,-9);

document.getElementById('speed').textContent=Math.round(speed)+' km/h';
renderer.render(scene,camera);
}

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').style.display='none';
animate();
</script>
</body>
</html>
